<ng-template #navLinks>
  @if (!isUserHasValidToken) {
    <button
      (click)="navigate('')"
      [ngClass]="currentActivatedUrl === '/' ? 'active' : ''"
      [attr.aria-current]="currentActivatedUrl === '/' ? 'page' : null"
      class="!rounded-3xl"
      mat-button>
      <mat-icon>home</mat-icon>
      <span>Home</span>
    </button>
  } @else {
    <button
      (click)="navigate('match')"
      [ngClass]="currentActivatedUrl === '/match' ? 'active' : ''"
      [attr.aria-current]="currentActivatedUrl === '/match' ? 'page' : null"
      class="!rounded-3xl"
      mat-button>
      <mat-icon> compare_arrows </mat-icon>
      <span>Match</span>
    </button>
    <button
      (click)="navigate('preferences')"
      [ngClass]="currentActivatedUrl === '/preferences' ? 'active' : ''"
      [attr.aria-current]="
        currentActivatedUrl === '/preferences' ? 'page' : null
      "
      class="!rounded-3xl"
      mat-button>
      <mat-icon>settings</mat-icon>
      <span>Preferences</span>
    </button>
    <button
      (click)="navigate('friends')"
      [ngClass]="currentActivatedUrl === '/friends' ? 'active' : ''"
      [attr.aria-current]="currentActivatedUrl === '/friends' ? 'page' : null"
      class="!rounded-3xl"
      mat-button>
      <mat-icon>group</mat-icon>
      <span>Friends</span>
    </button>
    <button
      (click)="navigate('find')"
      [ngClass]="currentActivatedUrl === '/find' ? 'active' : ''"
      [attr.aria-current]="currentActivatedUrl === '/find' ? 'page' : null"
      class="!rounded-3xl"
      mat-button>
      <mat-icon>search</mat-icon>
      <span>Find</span>
    </button>
  }
</ng-template>

<ng-template #navActions let-vertical="vertical">
  <div
    class="user-app-preferences-container"
    [ngClass]="{
      'border-r-[1px] pr-4': isUserHasValidToken,
      'is-vertical': vertical,
    }">
    <button
      mat-icon-button
      color="secondary"
      aria-label="Toggle theme button"
      (click)="toggleTheme()">
      @if (selectedTheme === 'dark') {
        <mat-icon>brightness_3</mat-icon>
      } @else {
        <mat-icon>wb_sunny</mat-icon>
      }
    </button>
  </div>
  @if (isUserHasValidToken) {
    <div
      class="flex items-center justify-center"
      [ngClass]="{
        'ml-4': !vertical,
        'p-4 rounded-xl shadow-lg': vertical,
      }">
      <span class="text-sm mr-4">Logged as</span>
      <img
        mat-icon-button
        [matMenuTriggerFor]="userMenu"
        class="rounded-full w-8 hover:cursor-pointer"
        [ngSrc]="userAvatarUrl"
        width="30"
        height="30"
        alt="User logo" />
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logoutUser()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  }
</ng-template>

<ng-template #navButtonContainer let-vertical="vertical">
  <ng-container [ngTemplateOutlet]="navLinks"></ng-container>
  <div class="flex-auto"></div>
  <ng-container
    [ngTemplateOutlet]="navActions"
    [ngTemplateOutletContext]="{ vertical: vertical }"></ng-container>
</ng-template>

<mat-toolbar color="primary">
  <mat-toolbar-row>
    @if (mobileQuery.matches) {
      <button mat-icon-button (click)="toggleSidenav(snav)">
        <mat-icon>menu</mat-icon>
      </button>
      <a
        class="brand"
        href="/"
        (click)="$event.preventDefault(); navigate('')"
        aria-label="Cinemate home">
        <img
          class="brand-mark"
          src="assets/cinemate-mark.svg"
          alt=""
          width="32"
          height="32" />
        <span class="brand-word">Cine<b>Mate</b></span>
      </a>
    } @else {
      <!-- three columns: the links stay in the middle of the page, whatever the sides weigh -->
      <div class="nav-side">
        <a
          class="brand"
          href="/"
          (click)="$event.preventDefault(); navigate('')"
          aria-label="Cinemate home">
          <img
            class="brand-mark"
            src="assets/cinemate-mark.svg"
            alt=""
            width="36"
            height="36" />
          <span class="brand-word">Cine<b>Mate</b></span>
        </a>
      </div>
      <div class="nav-links">
        <ng-container [ngTemplateOutlet]="navLinks"></ng-container>
      </div>
      <div class="nav-side nav-side--end">
        <ng-container
          [ngTemplateOutlet]="navActions"
          [ngTemplateOutletContext]="{
            vertical: false,
          }"></ng-container>
      </div>
    }
  </mat-toolbar-row>
</mat-toolbar>

<mat-sidenav-container
  class="example-sidenav-container"
  [style.marginTop.px]="mobileQuery.matches ? 56 : 0">
  <mat-sidenav
    #snav
    [mode]="mobileQuery.matches ? 'over' : 'side'"
    [fixedInViewport]="mobileQuery.matches"
    fixedTopGap="56">
    <ng-container
      [ngTemplateOutlet]="navButtonContainer"
      [ngTemplateOutletContext]="{
        vertical: true,
      }"></ng-container>
  </mat-sidenav>
</mat-sidenav-container>
