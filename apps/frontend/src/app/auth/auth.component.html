<div class="auth-hero">
  <img
    class="auth-mark"
    src="assets/cinemate-mark.svg"
    alt=""
    width="84"
    height="84" />
  <h1 class="auth-title">Cine<b>Mate</b></h1>
  <p class="auth-tagline">
    Rate movies, compare tastes with friends and pick tonight's film together.
  </p>

  <mat-card class="auth-card">
    <mat-card-content>
      <button
        class="google-button"
        mat-flat-button
        (click)="emitAuthButtonClicked('google')">
        <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path
            fill="#EA4335"
            d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z" />
          <path
            fill="#4285F4"
            d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z" />
          <path
            fill="#FBBC05"
            d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z" />
          <path
            fill="#34A853"
            d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z" />
        </svg>
        Continue with Google
      </button>
      <button
        class="facebook-button"
        mat-flat-button
        (click)="emitAuthButtonClicked('facebook')">
        <svg class="facebook-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#fff"
            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
        </svg>
        Continue with Facebook
      </button>
      @if (isDemoAvailable()) {
        <div class="demo-divider"><span>or</span></div>
        <button class="demo-button" mat-stroked-button (click)="startDemo()">
          <mat-icon>play_circle</mat-icon>
          Try the demo
        </button>
        <p class="demo-hint">
          No account needed. A shared demo with example friends and ratings.
        </p>
      }
    </mat-card-content>
  </mat-card>
</div>
